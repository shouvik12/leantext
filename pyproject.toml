[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leantext"
version = "0.2.0"
description = "Everything an agent reads, as clean Markdown. With proof of the tokens saved."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.15"
dependencies = [
  "trafilatura>=1.8",
  "markdownify>=0.12",
  "pypdf>=4",
  "pillow>=10",
  "pypdfium2>=4",
  # OCR: Tesseract is used if its binary is installed; otherwise Apple Vision on macOS, else RapidOCR.
  # RapidOCR (with OpenCV and ONNX Runtime, ~80 MB) is skipped on macOS, where Apple Vision does the work.
  "pytesseract>=0.3",
  "rapidocr_onnxruntime>=1.2; sys_platform != 'darwin'",
  "ocrmac>=1.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Word, Excel, PowerPoint and EPUB files (MarkItDown pulls in ~40 MB, so it's opt-in).
office = ["markitdown>=0.1"]
# RapidOCR on macOS too, as a backup if Apple Vision is unavailable.
ocr = ["rapidocr_onnxruntime>=1.2"]
tokens = ["tiktoken>=0.7"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
leantext = "leantext.cli:main"
leantext-hook = "leantext.hook:main"

[tool.setuptools.packages.find]
include = ["leantext*"]
